# Enhanced Industrial-Grade Local Memory System Configuration

# Database Configuration
database:
  url: ${DATABASE_URL}
  pool_size: 20
  max_overflow: 40
  pool_recycle: 3600
  echo: false

# Redis Configuration
redis:
  url: ${REDIS_URL:redis://:redis_password@localhost:6379/0}
  password: ${REDIS_PASSWORD:redis_password}
  cache_ttl: 3600  # seconds
  connection_pool_size: 10

# Ollama Configuration
ollama:
  url: ${OLLAMA_URL:http://localhost:11434}
  embedding_model: ${EMBEDDING_MODEL:nomic-embed-text}
  generation_model: ${GENERATION_MODEL:llama3.2:3b}
  timeout: 30
  health_check_interval: 30

# External API Configuration (for fallback)
external_apis:
  enabled: ${EXTERNAL_APIS_ENABLED:false}
  openai:
    api_key: ${OPENAI_API_KEY:}
    embedding_model: text-embedding-3-small
    generation_model: gpt-3.5-turbo
    fallback_priority: 1
  anthropic:
    api_key: ${ANTHROPIC_API_KEY:}
    generation_model: claude-3-haiku-20240307
    fallback_priority: 2
  cohere:
    api_key: ${COHERE_API_KEY:}
    embedding_model: embed-english-v3.0
    fallback_priority: 3

# Model Configuration
models:
  embedding_dimension: 768  # nomic-embed-text dimension
  max_context_tokens: 4096
  max_generation_tokens: 1024
  temperature: 0.1
  top_p: 0.9
  repetition_penalty: 1.1

# Search Configuration
search:
  default_top_k: 5
  similarity_threshold: 0.7
  use_cache: true
  hybrid_search_enabled: true
  bm25_weight: 0.3
  vector_weight: 0.7
  reranking_enabled: true
  reranking_model: ${RERANKING_MODEL:cross-encoder/ms-marco-MiniLM-L-6-v2}
  max_rerank_candidates: 20

# Cost Tracking & Optimization
cost_tracking:
  enabled: true
  local_cost: 0.0
  external_fallback_enabled: false
  budget_enforcement_enabled: ${BUDGET_ENFORCEMENT_ENABLED:false}
  daily_limit: ${DAILY_BUDGET_LIMIT:1.0}
  weekly_limit: ${WEEKLY_BUDGET_LIMIT:5.0}
  batch_processing_enabled: true
  max_batch_size: 50

# API Configuration
api:
  host: ${API_HOST:0.0.0.0}
  port: ${API_PORT:8000}
  debug: ${API_DEBUG:false}
  workers: ${API_WORKERS:4}
  cors_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
  rate_limit_enabled: true
  rate_limit_requests: 100
  rate_limit_period: 60  # seconds

# Celery Configuration (Async Task Processing)
celery:
  broker_url: ${CELERY_BROKER_URL:redis://:redis_password@localhost:6379/0}
  result_backend: ${CELERY_RESULT_BACKEND:redis://:redis_password@localhost:6379/1}
  worker_concurrency: ${CELERY_WORKER_CONCURRENCY:4}
  task_serializer: json
  result_serializer: json
  accept_content: [json]
  timezone: UTC
  beat_schedule:
    consolidate_memories:
      task: src.tasks.consolidate_memories
      schedule: 86400.0  # Run once per day
    cleanup_old_cache:
      task: src.tasks.cleanup_old_cache
      schedule: 3600.0   # Run once per hour

# Security Configuration
security:
  secret_key: ${SECRET_KEY:change-me-in-production-please}
  jwt_algorithm: HS256
  jwt_expire_minutes: 60
  password_hashing_rounds: 12
  cors_enabled: true

# Logging Configuration
logging:
  level: ${LOG_LEVEL:INFO}
  format: json
  file_enabled: false
  file_path: logs/memory_system.log
  rotation: 1 day
  retention: 7 days
  structured_logging: true

# Monitoring Configuration
monitoring:
  prometheus_enabled: true
  prometheus_port: 9090
  metrics_enabled: true
  health_check_endpoint: /health
  metrics_endpoint: /metrics
  grafana_enabled: false
  grafana_port: 3000

# Memory Consolidation Configuration
consolidation:
  enabled: true
  similarity_threshold: 0.85
  max_memories_per_consolidation: 100
  consolidation_model: ${CONSOLIDATION_MODEL:llama3.2:3b}
  max_tokens_per_consolidation: 2000
  min_memories_for_consolidation: 10
  schedule_interval: 86400  # seconds (1 day)

# Cache Configuration
cache:
  embedding_cache_enabled: true
  embedding_cache_ttl: 604800  # 7 days in seconds
  redis_cache_enabled: true
  redis_cache_ttl: 3600  # 1 hour
  memory_cache_enabled: true
  memory_cache_size: 1000
  cache_invalidation_strategy: lru

# Plugin System Configuration
plugins:
  enabled: true
  directory: plugins
  auto_discover: true
  required_interfaces:
    - pre_process
    - post_process
    - custom_search