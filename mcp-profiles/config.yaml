# Docker MCP Gateway Configuration

servers:
  technical-analyst:
    image: workspace-technical-analyst:latest
    environment:
      ALPHA_VANTAGE_KEY: ${DOCKER_MCP_SECRET_ALPHA_VANTAGE_KEY}
    resources:
      cpu: 1
      memory: 2GB

  fundamental-analyst:
    image: workspace-fundamental-analyst:latest
    environment:
      ALPHA_VANTAGE_KEY: ${DOCKER_MCP_SECRET_ALPHA_VANTAGE_KEY}
      FMP_API_KEY: ${DOCKER_MCP_SECRET_FMP_API_KEY}
    resources:
      cpu: 1
      memory: 2GB

enableAllServers: true
transport: streaming
port: 8080