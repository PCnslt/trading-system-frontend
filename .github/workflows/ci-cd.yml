name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: |
        cd backend
        mvn -B package --file pom.xml -DskipTests
    
    - name: Run tests
      run: |
        cd backend
        mvn test
    
    - name: Run integration tests
      run: |
        cd backend
        mvn verify -Dit.test="*IntegrationTest"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci --legacy-peer-deps
    
    - name: Build
      run: |
        cd frontend
        npm run build -- --configuration production
    
    - name: Run tests
      run: |
        cd frontend
        npm test -- --watch=false --browsers=ChromeHeadless

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/trading-monitoring-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/trading-monitoring-backend:${{ github.sha }}
    
    - name: Build and push frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/trading-monitoring-frontend:latest
          ${{ secrets.DOCKER_USERNAME }}/trading-monitoring-frontend:${{ github.sha }}
    
    - name: Build and push MCP servers
      run: |
        for agent in technical-analyst fundamental-analyst sentiment-analyst macro-analyst crypto-analyst options-analyst risk-analyst quant-analyst sector-analyst compliance-analyst; do
          docker build -t ${{ secrets.DOCKER_USERNAME }}/trading-$agent:latest ./mcp-servers/$agent
          docker push ${{ secrets.DOCKER_USERNAME }}/trading-$agent:latest
          docker tag ${{ secrets.DOCKER_USERNAME }}/trading-$agent:latest ${{ secrets.DOCKER_USERNAME }}/trading-$agent:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/trading-$agent:${{ github.sha }}
        done

  deploy:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to Kubernetes
      uses: azure/k8s-deploy@v4
      with:
        manifests: |
          kubernetes/deployment.yaml
          kubernetes/service.yaml
          kubernetes/ingress.yaml
        images: |
          ${{ secrets.DOCKER_USERNAME }}/trading-monitoring-backend:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/trading-monitoring-frontend:${{ github.sha }}
        kubectl-version: 'latest'
    
    - name: Deploy MCP Gateway
      run: |
        # Deploy MCP gateway configuration
        kubectl apply -f kubernetes/mcp-gateway.yaml
        
        # Update MCP profile
        kubectl create configmap mcp-profile --from-file=profiles/trading-agents.json -o yaml --dry-run=client | kubectl apply -f -

  auto-merge:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.ref }}
    
    - name: Check PR status
      id: check-status
      run: |
        # Check if all checks passed
        echo "Checking PR status..."
        # This would use GitHub API to check status
        echo "::set-output name=can_merge::true"
    
    - name: Auto-merge PR
      if: steps.check-status.outputs.can_merge == 'true'
      uses: pascalgn/automerge-action@v0.15.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MERGE_LABELS: "automerge"
        MERGE_METHOD: "squash"
        MERGE_COMMIT_MESSAGE: "Auto-merge: ${PR_TITLE}"
        MERGE_RETRIES: "3"
        MERGE_RETRY_SLEEP: "10000"